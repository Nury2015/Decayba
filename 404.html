    <!-- Google Tag Manager. Va lo más arriba posible del <head>, después del
         charset, para que alcance a medir la visita aunque la clienta se
         salga enseguida. El contenedor solo transporta etiquetas: lo que se
         mide de verdad se configura dentro de Tag Manager. -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TN4XWP5X');</script>

    <!-- Google Analytics (GA4). Va directo y no dentro de Tag Manager, para
         que empiece a contar sin depender de configurar el contenedor. Si
         algún día se agrega tambien desde Tag Manager, hay que quitarlo de
         aquí: si no, cada visita se cuenta dos veces. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YJGB6KT5PB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-YJGB6KT5PB');
    </script>
